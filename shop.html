<!-- SHOP SECTION -->
<section id="shop" class="section reveal-section hidden-section">
  <h2>Shop</h2>

  <div class="under-construction">
    <img src="images2/piglet-back.gif" alt="Under construction">
    <p>
      This section is currently under construction.<br>
      Come back soon for more!
    </p>
  </div>
</section>

<script>
  // Reveal section on scroll
  (function () {
    const revealSections = document.querySelectorAll('.reveal-section');

    if (!('IntersectionObserver' in window)) {
      revealSections.forEach(section => section.classList.remove('hidden-section'));
      return;
    }

    try {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.remove('hidden-section');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });

      revealSections.forEach(section => observer.observe(section));
    } catch (e) {
      revealSections.forEach(section => section.classList.remove('hidden-section'));
    }
  })();
</script>
