<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "Shannon Spence – Cartoonist" }}</title>
  <meta name="description" content="{{ page.description | default: "Shannon Spence is a cartoonist making comics, zines, and handmade publications based in Brooklyn, NY." }}" />

  <link rel="icon" type="image/png" href="{{ "/favicon.png" | relative_url }}">
  <link rel="stylesheet" href="{{ "/style2.css?v=3" | relative_url }}" />
</head>
<body>

<h1 class="seo-only">Shannon Spence – Cartoonist</h1>

  <!-- SPARKLE LAYER (behind cards, above background) -->
  <div id="sparkle-layer"></div>

  <!-- HEADER AREA -->
  <header class="site-header" id="top">
    <a href="{{ "/" | relative_url }}"><img src="{{ "/images2/name.png" | relative_url }}" alt="Header image" class="header-img"></a>
  </header>

  <!-- MAIN MENU (CIRCLES: ICON ABOVE TEXT) -->
  <nav class="main-nav">
    <a href="{{ "/comics" | relative_url }}">
      <img src="{{ "/images2/comics.png" | relative_url }}" class="nav-icon-img" alt="Comics icon">
      <span>Comics</span>
    </a>
    <a href="{{ "/otherart" | relative_url }}">
      <img src="{{ "/images2/otherart.png" | relative_url }}" class="nav-icon-img" alt="Other art icon">
      <span>Art</span>
    </a>
    <a href="https://shanzine.bigcartel.com/">
      <img src="{{ "/images2/bug.png" | relative_url }}" class="nav-icon-img" alt="Shop icon">
      <span>Shop</span>
    </a>
    <a href="{{ "/about" | relative_url }}">
      <img src="{{ "/images2/about.png" | relative_url }}" class="nav-icon-img" alt="About icon">
      <span>About</span>
    </a>
  </nav>

  {{ content }}

  <!-- Floating Lab Access GIF -->
  <div class="floating-cta">
    <a class="floating-cta__link" href="https://patreon.com/shannonspence" aria-label="Get lab access on Patreon">
      <img
        class="floating-cta__img"
        src="{{ "/images2/accesspass.gif" | relative_url }}"
        alt="Lab Access Pass"
        loading="lazy"
      >
    </a>
  </div>

  <div class="floating-cta">
    <iframe src="https://shanzine.substack.com/embed?transparent=1" style="border: 0; background: transparent" frameborder="0" scrolling="no"></iframe>
  </div>

  <!-- LIGHTBOX FOR COMICS / OTHER ART -->
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="">
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-links">
      <a href="https://instagram.com/shan.zine" target="_blank">
        <img src="{{ "/images2/ig2.png" | relative_url }}" alt="Instagram">
      </a>
      <a href="https://patreon.com/shannonspence">
        <img src="{{ "/images2/patreon.png" | relative_url }}" alt="Patreon">
      </a>
      <a href="https://shanzine.substack.com">
        <img src="{{ "/images2/substack.png" | relative_url }}" alt="Substack">
      </a>
      <a href="https://shanzine.itch.io">
        <img src="{{ "/images2/itch.png" | relative_url }}" alt="Itch.io">
      </a>
      <a href="https://bsky.app/profile/shanzine.bsky.social" target="_blank">
        <img src="{{ "/images2/blusky.png" | relative_url }}" alt="Bluesky">
      </a>
      <a href="mailto:me@shannon-spence.com">
        <img src="{{ "/images2/mail.png" | relative_url }}" alt="Email">
      </a>
      <a href="https://comixaccountability.club">
        <img src="{{ "/images2/cac2.png" | relative_url }}" alt="Comix Accountability Club">
      </a>
    </div>

    <button id="back-to-top" type="button">Back to top &uarr;</button>

    <div class="visitor-counter">
      <span>All images © Shannon Spence 2026</span>
    </div>
  </footer>

  <script>
    // Lightbox
    function openLightbox(img) {
      document.getElementById("lightbox-img").src = img.src;
      document.getElementById("lightbox").style.display = "flex";
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }

    // Expand/retract comic extras
    document.querySelectorAll('.comic-main').forEach(function (img) {
      img.addEventListener('click', function () {
        const parent = img.closest('.comic-item');
        parent.classList.toggle('expanded');
      });
    });

    // Expand/retract other art extras
    document.querySelectorAll('.art-main').forEach(function (img) {
      img.addEventListener('click', function () {
        const parent = img.closest('.art-item');
        parent.classList.toggle('expanded');
      });
    });

    // Reveal sections on scroll
    const revealSections = document.querySelectorAll('.reveal-section');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.remove('hidden-section');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });

    revealSections.forEach(section => {
      observer.observe(section);
    });

    // Sparkle layer
    function spawnSparkles() {
      const layer = document.getElementById('sparkle-layer');
      if (!layer) return;

      const maxSparkles = 120;

      for (let i = 0; i < 25; i++) {
        const s = document.createElement('span');
        s.className = 'sparkle';
        s.textContent = '\u2728';

        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;

        s.style.left = x + 'px';
        s.style.top = y + 'px';

        layer.appendChild(s);

        setTimeout(() => {
          s.remove();
        }, 2000);
      }

      const existing = layer.querySelectorAll('.sparkle');
      if (existing.length > maxSparkles) {
        const excess = existing.length - maxSparkles;
        for (let i = 0; i < excess; i++) {
          if (existing[i]) existing[i].remove();
        }
      }
    }

    // Smooth scroll for in-page anchors + global sparkles
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        const targetId = this.getAttribute('href').substring(1);
        const target = document.getElementById(targetId);
        if (target) {
          e.preventDefault();
          spawnSparkles();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // Sparkles on MAIN NAV clicks
    document.querySelectorAll('.main-nav a').forEach(link => {
      link.addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return;

        const href = this.getAttribute('href');
        if (!href) return;

        if (href.startsWith('#')) return;

        e.preventDefault();
        spawnSparkles();

        setTimeout(() => {
          window.location.href = href;
        }, 150);
      });
    });

    // Smooth scroll back to top + global sparkles
    document.getElementById('back-to-top').addEventListener('click', function () {
      spawnSparkles();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>

</body>
</html>
